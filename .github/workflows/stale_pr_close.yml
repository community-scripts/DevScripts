name: Stale PR and Issue Management
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request_target:
    types:
      - labeled
  issues:
    types:
      - labeled

# All deadlines live here. unmet-pr-close.yml repeats REQUIREMENTS_CLOSE_AFTER_DAYS
# in its comment text; keep the two in sync.
env:
  PR_STALE_AFTER_DAYS: 14
  PR_CLOSE_AFTER_DAYS: 14
  REQUIREMENTS_CLOSE_AFTER_DAYS: 14
  ISSUE_CLOSE_AFTER_DAYS: 21
  REMIND_BEFORE_DAYS: 3
  # Labels that keep a PR or issue open no matter what; `stale` is taken off again.
  # Matches STALE_EXEMPT in scripts/telemetry-issue-stats.js.
  STALE_EXEMPT_LABELS: "keep-open,Migration To ProxmoxVE,Started Migration To ProxmoxVE"

jobs:
  stale-prs:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: Handle stale PRs
        uses: actions/github-script@v9
        with:
          script: |
            const now = new Date();
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const REQ = "requirements missing";
            const MAINTAINERS = ["OWNER", "MEMBER", "COLLABORATOR"];
            const STALE_AFTER = Number(process.env.PR_STALE_AFTER_DAYS);
            const CLOSE_AFTER = Number(process.env.PR_CLOSE_AFTER_DAYS);
            const REQ_CLOSE_AFTER = Number(process.env.REQUIREMENTS_CLOSE_AFTER_DAYS);
            const REMIND_BEFORE = Number(process.env.REMIND_BEFORE_DAYS);
            const REMINDER = "<!-- stale-reminder -->";
            const EXEMPT = process.env.STALE_EXEMPT_LABELS.split(",");
            const exempt = labels => labels.some(l => EXEMPT.includes(l));
            const days = d => (now - d) / (1000 * 60 * 60 * 24);
            const latest = dates => dates.length > 0 ? new Date(Math.max(...dates)) : null;
            const staleNotice = author =>
              `@${author} This PR has been marked as stale. It will be closed in ${CLOSE_AFTER} days unless new commits are pushed or someone comments here.`;

            // True once the deadline has passed; before that, posts one reminder
            // REMIND_BEFORE days ahead of it.
            const deadlinePassed = async (number, clockStart, limit, comments, reminder) => {
              const age = days(clockStart);
              if (age > limit) return true;
              const reminded = comments.some(c =>
                c.user?.type === "Bot" && c.body?.includes(REMINDER) && new Date(c.created_at) > clockStart);
              if (age > limit - REMIND_BEFORE && !reminded) {
                const left = Math.max(1, Math.ceil(limit - age));
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number, body: `${REMINDER}\n${reminder(left)}`
                });
              }
              return false;
            };

            // Only fires for a maintainer's label: labels set with GITHUB_TOKEN raise no event.
            if (context.eventName === "pull_request_target" && context.payload.action === "labeled") {
              const pr = context.payload.pull_request;
              const labels = (pr.labels || []).map(l => l.name);
              if (context.payload.label?.name !== "stale") return;
              if (exempt(labels) || pr.draft) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: "stale" });
                return;
              }
              if (!labels.includes(REQ)) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number, body: staleNotice(pr.user.login)
                });
              }
              return;
            }

            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });

            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name);
              const author = pr.user.login;
              const hasStale = labels.includes("stale");

              // Covers the requirements track too: an exempt PR or a draft is never closed.
              if (exempt(labels) || pr.draft) {
                if (hasStale) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: "stale" });
                }
                continue;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100
              });
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: pr.number, per_page: 100
              });
              // Committer date, not author date: a rebase or amend keeps the author
              // date, so a freshly rebased PR used to look as old as its first commit.
              const lastCommitDate =
                latest(commits.map(c => new Date(c.commit.committer?.date || c.commit.author.date))) ||
                new Date(pr.created_at);
              const humanComments = comments.filter(c => c.user?.type !== "Bot");
              const maintainerReply = c =>
                MAINTAINERS.includes(c.author_association) && c.user?.login !== author;

              // -------------------------------------------------------
              // Requirements missing: its own deadline, set by unmet-pr-close.yml.
              // Only fixing the description (which removes the label there) ends it.
              // -------------------------------------------------------
              if (labels.includes(REQ)) {
                // Older runs of unmet-pr-close.yml set `stale` alongside the label.
                if (hasStale) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: "stale" });
                }
                const events = await github.paginate(github.rest.issues.listEvents, {
                  owner, repo, issue_number: pr.number, per_page: 100
                });
                const reqDate = latest(events
                  .filter(e => e.event === "labeled" && e.label?.name === REQ)
                  .map(e => new Date(e.created_at)));
                if (!reqDate) continue;

                // A maintainer comment after the label restarts the clock.
                const clockStart = latest([reqDate, ...humanComments
                  .filter(maintainerReply)
                  .map(c => new Date(c.created_at))
                  .filter(d => d > reqDate)]);
                const close = await deadlinePassed(pr.number, clockStart, REQ_CLOSE_AFTER, comments, left =>
                  `@${author} Reminder: this PR will be closed in ${left} day(s) unless the items from the requirements check above are fixed in the PR description.`);
                if (!close) continue;

                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: `@${author} Closing: the items from the requirements check above were still missing ${REQ_CLOSE_AFTER} days later. Once they are in place, please open a new pull request.`
                });
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: "closed" });
                continue;
              }

              // -------------------------------------------------------
              // Auto-label PRs with no activity in the last PR_STALE_AFTER_DAYS,
              // but ONLY if someone other than the author has engaged.
              // -------------------------------------------------------
              if (!hasStale) {
                const reviews = await github.paginate(github.rest.pulls.listReviews, {
                  owner, repo, pull_number: pr.number, per_page: 100
                });
                const engaged =
                  reviews.some(r => r.user?.type !== "Bot" && r.user?.login !== author) ||
                  humanComments.some(c => c.user?.login !== author);
                if (!engaged) continue;

                const lastCommentDate = humanComments.length > 0
                  ? new Date(humanComments[humanComments.length - 1].created_at)
                  : null;
                const lastActivityDate = lastCommentDate && lastCommentDate > lastCommitDate
                  ? lastCommentDate
                  : lastCommitDate;

                if (days(lastActivityDate) > STALE_AFTER) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ["stale"] });
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: staleNotice(author) });
                }
                continue;
              }

              // -------------------------------------------------------
              // Manage already-stale PRs
              // -------------------------------------------------------
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner, repo, issue_number: pr.number, per_page: 100
              });
              const staleLabelDate = latest(events
                .filter(e => e.event === "labeled" && e.label?.name === "stale")
                .map(e => new Date(e.created_at)));
              if (!staleLabelDate) continue;

              // A push ends the mark. Force-push events catch a push of older
              // commits too, whose dates alone would not show it.
              const lastPushDate = latest([lastCommitDate, ...events
                .filter(e => e.event === "head_ref_force_pushed")
                .map(e => new Date(e.created_at))]);
              if (lastPushDate > staleLabelDate) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: "stale" });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: `@${author} Recent activity detected. Removing stale label.`
                });
                continue;
              }

              // Any human comment after the mark (author, maintainer or tester) restarts the clock.
              const clockStart = latest([staleLabelDate, ...humanComments
                .map(c => new Date(c.created_at))
                .filter(d => d > staleLabelDate)]);
              const close = await deadlinePassed(pr.number, clockStart, CLOSE_AFTER, comments, left =>
                `@${author} Reminder: this stale PR will be closed in ${left} day(s) unless new commits are pushed or someone comments here.`);
              if (!close) continue;

              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `@${author} Closing stale PR due to inactivity (no commits or comments for ${CLOSE_AFTER} days after the stale label).`
              });
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: "closed" });
            }

  # A maintainer marks an issue `stale` by hand, or scripts/telemetry-issue-stats.js
  # does when an app keeps failing. ISSUE_CLOSE_AFTER_DAYS later the issue is
  # closed and, for a script issue whose files the notice listed, those files are
  # removed from the default branch by the job below. An open PR that touches
  # the files holds the close back.
  stale-issues:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'stale' && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read
    outputs:
      closed: ${{ steps.issues.outputs.closed }}
    steps:
      - name: Handle stale issues
        id: issues
        uses: actions/github-script@v9
        with:
          script: |
            const now = new Date();
            const { owner, repo } = context.repo;
            const CLOSE_AFTER = Number(process.env.ISSUE_CLOSE_AFTER_DAYS);
            const REMIND_BEFORE = Number(process.env.REMIND_BEFORE_DAYS);
            const REMINDER = "<!-- stale-reminder -->";
            const EXEMPT = process.env.STALE_EXEMPT_LABELS.split(",");
            const exempt = labels => labels.some(l => EXEMPT.includes(l));
            const days = d => (now - d) / (1000 * 60 * 60 * 24);
            const latest = dates => dates.length > 0 ? new Date(Math.max(...dates)) : null;
            const SEG = "[A-Za-z0-9][A-Za-z0-9._-]*";

            // The files a New Script issue stands for, read from the issue form the
            // same way pr-script-test.yml and delete_new_script.yaml read it.
            // null: not a script issue, or no path we can trust.
            const scriptFiles = issue => {
              const body = (issue.body || "").replace(/\r/g, "");
              const field = name => {
                const m = body.match(new RegExp(`^###[ \t]*${name}[ \t]*\n+([^\n#][^\n]*)`, "m"));
                return m && m[1].trim() !== "_No response_" ? m[1].trim() : "";
              };
              const name = field("Name of the Script");
              if (!name) return null;
              const slug = name.toLowerCase().replace(/\s+/g, "-");
              if (!/^[a-z0-9][a-z0-9._-]*$/.test(slug)) return null;
              const type = field("Script Type");
              const path = field("Script path").replace(/^\/+/, "");
              let script;
              if (new RegExp(`^(ct|vm|tools)/(${SEG}/)?${SEG}\\.sh$`).test(path)) script = path;
              else if (/^VM\b/.test(type)) script = `vm/${slug}.sh`;
              else if (/^Addon\b/.test(type)) script = `tools/addon/${slug}.sh`;
              else if (/^PVE Tool\b/.test(type)) script = `tools/pve/${slug}.sh`;
              else if (/^CT\b/.test(type)) script = `ct/${slug}.sh`;
              else return null; // no type, or "Other" without a path: nothing to delete
              const files = [script];
              const ct = script.match(/^ct\/(.+)\.sh$/);
              if (ct) files.push(`install/${ct[1]}-install.sh`);
              files.push(`json/${slug}.json`);
              return { slug, files };
            };
            const fileList = s => s.files.map(f => `- \`${f}\``).join("\n");

            // The issue body stays editable by its author, so the files are fixed
            // when the maintainer adds the label: they go into the bot's notice,
            // where the maintainer sees them, and the daily run reads them only
            // from there. Editing "Script path" later cannot retarget the delete.
            const MARK = "<!-- stale-issue-files ";
            const SELF = "github-actions[bot]";
            const PATH_RE = new RegExp(`^(ct|vm|tools|install|json)/(${SEG}/)?${SEG}\\.(sh|json)$`);
            const snapshot = (comments, after) => {
              const mine = comments.filter(c =>
                c.user?.login === SELF && c.body?.includes(MARK) && new Date(c.created_at) >= after);
              if (mine.length === 0) return null;
              // The first one: the notice for this label. Any later bot comment
              // (other workflows post as the same bot) is never the manifest.
              mine.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
              const parts = mine[0].body.split(MARK);
              if (parts.length !== 2) return null;
              const raw = parts[1].split(" -->")[0];
              try {
                const s = JSON.parse(raw);
                if (/^[a-z0-9][a-z0-9._-]*$/.test(s.slug) && Array.isArray(s.files) &&
                    s.files.length > 0 && s.files.every(f => typeof f === "string" && PATH_RE.test(f))) return s;
              } catch {}
              return null;
            };

            // Only fires for a maintainer's label: labels set with GITHUB_TOKEN raise no event.
            if (context.eventName === "issues") {
              const issue = context.payload.issue;
              // Triage can label too; a label that can end in deleted files needs
              // a person with write, as /test does. Bots (nothing here marks issues
              // stale through an app) and a failed lookup count as no access, and
              // the label is taken off again.
              const sender = context.payload.sender;
              let permission = "none";
              if (sender.type !== "Bot") {
                try {
                  ({ data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: sender.login }));
                } catch (e) {
                  core.warning(`Permission lookup for ${sender.login} failed: ${e.message}`);
                }
              }
              if (!["admin", "maintain", "write"].includes(permission)) {
                core.notice(`${sender.login} (${sender.type}) has ${permission} access; marking an issue stale needs write`);
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "stale" });
                return;
              }
              if (exempt((issue.labels || []).map(l => l.name))) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "stale" });
                return;
              }
              const s = scriptFiles(issue);
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: s
                  ? `@${issue.user.login} This issue has been marked as stale. If there is no new commit to the script and no comment here within ${CLOSE_AFTER} days, the issue will be closed and these files removed from the repository:\n\n${fileList(s)}\n\nAn open pull request that changes these files holds this back.\n\n${MARK}${JSON.stringify(s)} -->`
                  : `@${issue.user.login} This issue has been marked as stale. It will be closed in ${CLOSE_AFTER} days unless someone comments here.`
              });
              return;
            }

            // Open PRs and the files they change, fetched once and only if needed.
            let openPrs = null;
            const fixPr = async files => {
              if (!openPrs) {
                openPrs = [];
                const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
                for (const pr of prs) {
                  const changed = await github.paginate(github.rest.pulls.listFiles, {
                    owner, repo, pull_number: pr.number, per_page: 100
                  });
                  openPrs.push({ number: pr.number, files: new Set(changed.map(f => f.filename)) });
                }
              }
              return openPrs.find(p => files.some(f => p.files.has(f)));
            };

            const issues = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "stale", per_page: 100
            })).filter(i => !i.pull_request);
            const closed = [];

            for (const issue of issues) {
              const labels = issue.labels.map(l => l.name);
              const author = issue.user.login;

              if (exempt(labels)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "stale" });
                continue;
              }

              const events = await github.paginate(github.rest.issues.listEvents, {
                owner, repo, issue_number: issue.number, per_page: 100
              });
              const staleDates = events
                .filter(e => e.event === "labeled" && e.label?.name === "stale")
                .map(e => new Date(e.created_at));
              if (staleDates.length === 0) continue;
              const staleLabelDate = new Date(Math.max(...staleDates));
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, since: staleLabelDate.toISOString(), per_page: 100
              });
              // No notice for this label (e.g. it was set by a token that raises no
              // event): the issue is still closed, but nothing is deleted.
              const s = snapshot(comments, staleLabelDate);

              // A commit to the script on the default branch ends the mark.
              if (s) {
                let touched = false;
                for (const path of s.files) {
                  const { data } = await github.rest.repos.listCommits({
                    owner, repo, path, since: staleLabelDate.toISOString(), per_page: 1
                  });
                  if (data.length > 0) { touched = true; break; }
                }
                if (touched) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "stale" });
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issue.number,
                    body: `@${author} Recent commits to the script detected. Removing stale label.`
                  });
                  continue;
                }
              }

              // An open PR on the script's files: someone is fixing it, so wait.
              if (s) {
                const pr = await fixPr(s.files);
                if (pr) {
                  core.info(`#${issue.number}: open PR #${pr.number} touches the script, not closing.`);
                  continue;
                }
              }

              // Any human comment after the mark restarts the clock: test reports
              // from users are the feedback this deadline is meant to draw out.
              const clockStart = latest([staleLabelDate, ...comments
                .filter(c => c.user?.type !== "Bot")
                .map(c => new Date(c.created_at))
                .filter(d => d > staleLabelDate)]);
              const age = days(clockStart);
              if (age <= CLOSE_AFTER) {
                const reminded = comments.some(c =>
                  c.user?.type === "Bot" && c.body?.includes(REMINDER) && new Date(c.created_at) > clockStart);
                if (age > CLOSE_AFTER - REMIND_BEFORE && !reminded) {
                  const left = Math.max(1, Math.ceil(CLOSE_AFTER - age));
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issue.number,
                    body: `${REMINDER}\n@${author} Reminder: this stale issue will be closed in ${left} day(s)` +
                      (s ? " and the script's files removed, unless someone comments here or a commit or an open pull request touches them."
                         : " unless someone comments here.")
                  });
                }
                continue;
              }

              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: s
                  ? `@${author} Closing stale issue due to inactivity (no commits to the script or comments for ${CLOSE_AFTER} days). The script's files are being removed from the repository.`
                  : `@${author} Closing stale issue due to inactivity (no comments for ${CLOSE_AFTER} days).`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: "closed", state_reason: "not_planned"
              });
              if (s) closed.push({ number: issue.number, slug: s.slug, files: s.files });
            }

            core.setOutput("closed", JSON.stringify(closed));

  # One PR for every script whose issue was closed above, merged by the merge bot.
  delete-stale-scripts:
    needs: stale-issues
    if: >-
      needs.stale-issues.outputs.closed != '' && needs.stale-issues.outputs.closed != '[]' &&
      github.repository == 'community-scripts/DevScripts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate a token for PR approval and merge
        id: generate-token-merge
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GHAPP_MERGEBOT_ID }}
          private-key: ${{ secrets.GHAPP_MERGEBOT_PRIVATE_KEY }}
          owner: community-scripts
          repositories: DevScripts

      - name: Remove the scripts, open and merge the PR
        env:
          CLOSED: ${{ needs.stale-issues.outputs.closed }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ steps.generate-token-merge.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="stale-script-cleanup-${GITHUB_RUN_ID}"
          git checkout -b "$branch"

          numbers=()
          slugs=()
          lines=""
          while IFS= read -r item; do
            number=$(jq -r '.number' <<<"$item")
            slug=$(jq -r '.slug' <<<"$item")
            mapfile -t files < <(jq -r '.files[]' <<<"$item")
            before=$(git diff --cached --name-only | wc -l)
            git rm -q --ignore-unmatch -- "${files[@]}"
            if [ "$(git diff --cached --name-only | wc -l)" -gt "$before" ]; then
              numbers+=("$number")
              slugs+=("$slug")
              lines+="- \`${slug}\` (#${number})"$'\n'
            else
              echo "#$number ($slug): no files left to remove"
            fi
          done < <(jq -c '.[]' <<<"$CLOSED")

          if [ "${#numbers[@]}" -eq 0 ]; then
            echo "Nothing to remove."
            exit 0
          fi

          joined=$(printf '%s, ' "${slugs[@]}")
          joined="${joined%, }"
          git commit -m "Delete stale scripts: ${joined}"
          git push origin "$branch"

          body="Automated cleanup: these script issues were closed as stale (no commits for ${ISSUE_CLOSE_AFTER_DAYS} days after the stale label)."$'\n\n'"${lines}"
          url=$(gh pr create --base main --head "$branch" --title "Delete stale scripts: ${joined}" --body "$body")
          pr_number="${url##*/}"

          GH_TOKEN="$MERGE_TOKEN" gh pr review "$pr_number" --approve
          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$pr_number" --squash --admin --delete-branch

          for n in "${numbers[@]}"; do
            gh issue comment "$n" --body "Files removed with #${pr_number}."
          done
