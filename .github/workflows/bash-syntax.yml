name: Bash Syntax Check

on:
  pull_request:
    paths:
      - "ct/**/*.sh"
      - "install/**/*.sh"
      - "vm/**/*.sh"
      - "tools/**/*.sh"
      - ".github/workflows/bash-syntax.yml"
      - ".github/workflows/scripts/fedora-image-test.sh"
      - ".github/workflows/scripts/unifi-vm-test.sh"
      - ".github/workflows/scripts/zima-release-test.sh"
      - ".github/workflows/scripts/initiative-test.sh"
      - "docs/guides/initiative.md"
      - "json/unifi-os-server-vm.json"
  push:
    branches: [main]
    paths:
      - "ct/**/*.sh"
      - "install/**/*.sh"
      - "vm/**/*.sh"
      - "tools/**/*.sh"
      - ".github/workflows/bash-syntax.yml"
      - ".github/workflows/scripts/fedora-image-test.sh"
      - ".github/workflows/scripts/unifi-vm-test.sh"
      - ".github/workflows/scripts/zima-release-test.sh"
      - ".github/workflows/scripts/initiative-test.sh"
      - "docs/guides/initiative.md"
      - "json/unifi-os-server-vm.json"

# The engine moved to community-scripts/core, which syntax-checks its own
# .func files. This repo ships scripts, so that is what gets checked here —
# all of them, not the three-file sample the old job used.

permissions:
  contents: read

jobs:
  bash-n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax-check every script
        run: |
          set -euo pipefail
          fail=0
          checked=0
          while IFS= read -r -d '' f; do
            checked=$((checked + 1))
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n failed"
              fail=1
            fi
          done < <(find ct install vm tools -type f -name '*.sh' -print0 2>/dev/null | sort -z)
          echo "checked $checked scripts"
          exit "$fail"

      - name: Fedora image customization feedback
        if: ${{ hashFiles('vm/fedora-vm.sh') != '' }}
        run: bash .github/workflows/scripts/fedora-image-test.sh

      - name: UniFi VM provisioning
        if: ${{ hashFiles('vm/unifi-os-server-vm.sh') != '' }}
        run: bash .github/workflows/scripts/unifi-vm-test.sh

      - name: ZimaOS release and ISO selection
        if: ${{ hashFiles('vm/zimaos-vm.sh') != '' }}
        run: bash .github/workflows/scripts/zima-release-test.sh

      - name: Initiative installer and update failure boundaries
        if: ${{ hashFiles('ct/initiative.sh') != '' }}
        run: bash .github/workflows/scripts/initiative-test.sh
